name: Daily EP scan and Pages
on:
  schedule:
    # 19:30 IST. Independent acquisition; no Kell or Stage dependency.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh prices and catalyst feeds
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['pipeline/**', 'tests/**', 'web/index.html', '.github/workflows/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-ep
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/cache/restore@v5
        with:
          path: pipeline/cache
          key: ep-own-market-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ep-own-market-${{ runner.os }}-
      - name: Install own market-data dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Fetch own NSE universe, EOD prices and catalysts
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        run: |
          set -euo pipefail
          python pipeline/run.py 2>&1 | tee /tmp/ep-scan.log
      - uses: actions/cache/save@v5
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.refresh_data)
        with:
          path: pipeline/cache
          key: ep-own-market-${{ runner.os }}-${{ github.run_id }}
      - name: Commit validated scan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data pipeline/news_archive.json pipeline/story_state.json pipeline/benchmark_midsmall400.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update EP scan and dated catalyst evidence [skip ci]'
            git push
          fi
      - name: Configure native GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload validated website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy and verify the public dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
      - name: Attach scan diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: scan-log
          path: /tmp/ep-scan.log
          if-no-files-found: ignore
