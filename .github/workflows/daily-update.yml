name: Daily EP scan and Pages
on:
  schedule:
    # 19:30 IST. Regenerate the upstream artifact in this runner first.
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh prices and catalyst feeds
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['pipeline/**', 'tests/**', 'web/index.html', '.github/workflows/**']
permissions:
  contents: write
concurrency:
  group: daily-ep
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Checkout validated universe and OHLCV
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        uses: actions/checkout@v6
        with:
          repository: arjunbchavan1989-AB/nse-kell-price-cycle
          path: .upstream
          sparse-checkout: |
            web/data
            pipeline
            tests
      - name: Install existing upstream pipeline dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        run: pip install -r .upstream/pipeline/requirements.txt
      - name: Restore upstream history cache
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        uses: actions/cache/restore@v5
        with:
          path: .upstream/pipeline/cache
          key: ep-upstream-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ep-upstream-${{ runner.os }}-
      - name: Validate and refresh upstream EOD artifact locally
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        run: |
          python -m unittest discover -s .upstream/tests -v
          python .upstream/pipeline/run.py
      - name: Save validated upstream history cache
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        uses: actions/cache/save@v5
        with:
          path: .upstream/pipeline/cache
          key: ep-upstream-${{ runner.os }}-${{ github.run_id }}
      - name: Run scanner and catalyst collection
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        run: python pipeline/run.py --upstream-dir .upstream/web/data
      - name: Commit validated scan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data pipeline/news_archive.json pipeline/story_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update EP scan and dated catalyst evidence [skip ci]'
            git push
          fi
      - name: Deploy dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web
          publish_branch: gh-pages
          force_orphan: true
